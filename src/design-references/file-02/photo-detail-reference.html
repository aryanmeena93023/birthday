<style data-purpose="atmospheric-effects">
    /* Deep charcoal archival background with peripheral vignette */
    .archival-base {
      background-color: #040303;
      background-image: 
        radial-gradient(ellipse 90% 75% at 50% 50%, rgba(22, 16, 10, 0.45) 0%, rgba(5, 4, 4, 0.94) 75%, #020202 100%);
    }

    /* Ambient breathing multi-layered warm amber-gold haze */
    .central-glow {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse 64% 50% at 50% 50%, rgba(159, 121, 59, 0.28) 0%, rgba(94, 65, 27, 0.18) 32%, rgba(42, 30, 15, 0.10) 60%, transparent 78%),
        radial-gradient(ellipse 85% 42% at 50% 48%, rgba(195, 145, 55, 0.14) 0%, rgba(130, 85, 25, 0.08) 42%, transparent 72%),
        radial-gradient(circle at 50% 50%, rgba(218, 170, 75, 0.09) 0%, transparent 55%);
      animation: haze-breathe 13s ease-in-out infinite alternate;
      will-change: transform, opacity;
      pointer-events: none;
    }

    @keyframes haze-breathe {
      0% {
        transform: scale(0.98);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.02);
        opacity: 1.0;
      }
      100% {
        transform: scale(1.05);
        opacity: 0.9;
      }
    }

    /* Canvas Particle Layer */
    #dustParticlesCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Photo aperture matte texture - maintains deep, tactile dark surface without fading */
    .photo-matte {
      background: 
        radial-gradient(circle at 45% 40%, rgba(38, 34, 30, 0.6) 0%, rgba(14, 13, 11, 0.95) 75%),
        repeating-radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.015) 0px, rgba(0, 0, 0, 0.03) 1px, transparent 2px);
      box-shadow: inset 0 0 35px 10px rgba(0, 0, 0, 0.88);
    }

    /* Ivory paper texture */
    .paper-texture {
      background-color: #f4efe5;
      background-image: 
        radial-gradient(at 15% 10%, rgba(255, 255, 255, 0.6) 0px, transparent 50%),
        radial-gradient(at 85% 90%, rgba(190, 175, 150, 0.18) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(230, 220, 200, 0.1) 0px, transparent 60%);
      box-shadow: 
        0 25px 60px -12px rgba(0, 0, 0, 0.8),
        0 10px 25px -5px rgba(0, 0, 0, 0.6),
        0 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    /* Soft Magnetic Glide interaction on entire ivory card */
    .card-magnetic-glide {
      will-change: transform;
      transform: translate3d(var(--card-glide-x, 0px), var(--card-glide-y, 0px), 0);
      transition: transform 400ms cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Parchment Living Warmth breathing animation */
    @keyframes parchment-breathe {
      0%, 100% {
        opacity: 0.18;
      }
      50% {
        opacity: 0.52;
      }
    }

    .paper-living-light {
      animation: parchment-breathe 10s ease-in-out infinite alternate;
      will-change: opacity;
    }

    /* Pointer-interactive subtle reflection layer on ivory paper */
    .card-interactive-sheen {
      opacity: 0;
      transition: opacity 0.6s ease;
      background: radial-gradient(
        circle 290px at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(255, 238, 205, 0.18) 0%,
        rgba(235, 205, 150, 0.08) 45%,
        transparent 75%
      );
      pointer-events: none;
      mix-blend-mode: soft-light;
    }

    .card-has-pointer .card-interactive-sheen {
      opacity: 1;
    }

    /* =========================================================
       REFINED MEMORY ENGRAVING INTERACTION & ANIMATION SYSTEM
       ========================================================= */

    /* Photograph container base border transition */
    .photo-frame-target {
      outline: none;
      transition: border-color 300ms ease, box-shadow 300ms ease;
    }

    /* Enhanced warm antique-gold border on interactive active/hover */
    .photo-frame-target.is-active,
    .photo-frame-target:focus-visible {
      border-color: rgba(206, 173, 114, 0.85);
      box-shadow: 0 0 14px rgba(195, 156, 92, 0.18);
    }

    /* Keyboard focus ring preserving archival aesthetic */
    .photo-frame-target:focus-visible {
      outline: 1.5px solid rgba(214, 185, 128, 0.65);
      outline-offset: 3px;
    }

    /* Pointer-Aware Engraved Frame: Proximity localized highlight on gilded border */
    .photo-frame-target {
      --frame-px: 50%;
      --frame-py: 50%;
      --frame-sheen-opacity: 0;
    }
    .photo-frame-target::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 6;
      border: 1px solid transparent;
      background: radial-gradient(
        ellipse 220px 140px at var(--frame-px) var(--frame-py),
        rgba(255, 246, 218, 0.88) 0%,
        rgba(224, 188, 122, 0.42) 40%,
        rgba(150, 115, 60, 0.12) 70%,
        transparent 85%
      ) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: var(--frame-sheen-opacity);
      transition: opacity 300ms cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Exact Perimeter SVG Trace path:
       Uses pathLength="400" along perimeter:
       Start top-left (0,0) -> top-right (100,0) [100 units / 25%]
       -> bottom-right (100,100) [200 units / 50%]
       -> bottom-left (0,100) [300 units / 75%]
       -> back to top-left (0,0) [400 units / 100%]
       dasharray: 90 (beam head with falloff) 310 (gap)
    */

    /* Idle cadence: Long, peaceful archival rhythm (~13s total cycle: 3s trace + 10s quiet gap) */
    @keyframes perimeter-trace-idle {
      0% {
        stroke-dashoffset: 490;
        opacity: 0;
      }
      2% {
        opacity: 0.9;
      }
      23% {
        stroke-dashoffset: 90;
        opacity: 0.9;
      }
      26% {
        stroke-dashoffset: 90;
        opacity: 0;
      }
      100% {
        stroke-dashoffset: 90;
        opacity: 0;
      }
    }

    /* Idle Corner Glints synchronized to perimeter trace */
    @keyframes glint-idle-tl {
      0%, 0.5% { transform: scale(0.4); opacity: 0; }
      1.5% { transform: scale(1.15); opacity: 0.95; }
      3.2% { transform: scale(0.6); opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes glint-idle-tr {
      0%, 5.5% { transform: scale(0.4); opacity: 0; }
      7% { transform: scale(1.15); opacity: 0.95; }
      9% { transform: scale(0.6); opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes glint-idle-br {
      0%, 11% { transform: scale(0.4); opacity: 0; }
      12.5% { transform: scale(1.15); opacity: 0.95; }
      14.5% { transform: scale(0.6); opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes glint-idle-bl {
      0%, 16.5% { transform: scale(0.4); opacity: 0; }
      18% { transform: scale(1.15); opacity: 0.95; }
      20% { transform: scale(0.6); opacity: 0; }
      100% { opacity: 0; }
    }

    /* Idle animation assignments */
    .perimeter-trace-beam {
      stroke-dasharray: 90 310;
      stroke-dashoffset: 490;
      animation: perimeter-trace-idle 13s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
      will-change: stroke-dashoffset, opacity;
    }

    .corner-glint-tl {
      animation: glint-idle-tl 13s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      will-change: transform, opacity;
    }
    .corner-glint-tr {
      animation: glint-idle-tr 13s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      will-change: transform, opacity;
    }
    .corner-glint-br {
      animation: glint-idle-br 13s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      will-change: transform, opacity;
    }
    .corner-glint-bl {
      animation: glint-idle-bl 13s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      will-change: transform, opacity;
    }

    /* Soft steady ambient rim glow that settles quietly without strobing or repeating */
    .steady-settled-aura {
      opacity: 0.16;
      transition: opacity 300ms ease;
    }
    .photo-frame-target.is-active .steady-settled-aura,
    .photo-frame-target:focus-visible .steady-settled-aura {
      opacity: 0.42;
    }

    /* Restrained inner bevel rim reflection: smoothly brightens near pointer */
    .photo-inner-rim-sheen {
      opacity: 0;
      transition: opacity 300ms cubic-bezier(0.25, 1, 0.5, 1);
      background: radial-gradient(
        ellipse 220px 140px at var(--photo-rx, 50%) var(--photo-ry, 50%),
        rgba(248, 228, 185, 0.12) 0%,
        rgba(215, 178, 115, 0.04) 45%,
        transparent 70%
      );
      mix-blend-mode: screen;
      pointer-events: none;
    }
    .photo-frame-target.is-active .photo-inner-rim-sheen,
    .photo-frame-target:focus-visible .photo-inner-rim-sheen {
      opacity: 1;
    }

    /* =========================================================
       HARMONIZED "MEMORY RESONANCE" HOVER DYNAMICS
       Harmonized sequence: graceful 200-250ms onset,
       feathered champagne-gold ripple (~650ms),
       soft narrow diagonal glass glide (~850ms),
       proximity-based frame bevel highlight.
       ========================================================= */

    /* Archival Glass Reflection: soft, narrow diagonal reflection band (850ms single glide) */
    .archival-glass-sheen {
      position: absolute;
      inset: -60%;
      width: 220%;
      height: 220%;
      pointer-events: none;
      z-index: 5;
      background: linear-gradient(
        135deg,
        transparent 40%,
        rgba(248, 240, 222, 0.02) 46%,
        rgba(238, 214, 168, 0.08) 49%,
        rgba(255, 248, 235, 0.12) 50%,
        rgba(238, 214, 168, 0.08) 51%,
        rgba(248, 240, 222, 0.02) 54%,
        transparent 60%
      );
      opacity: 0;
      transform: translate3d(-60%, -60%, 0) rotate(-38deg);
      mix-blend-mode: screen;
    }

    .photo-frame-target.is-active .archival-glass-sheen {
      animation: glass-sweep 850ms 220ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes glass-sweep {
      0% {
        transform: translate3d(-65%, -65%, 0) rotate(-38deg);
        opacity: 0;
      }
      20% {
        opacity: 0.85;
      }
      70% {
        opacity: 0.7;
      }
      100% {
        transform: translate3d(55%, 55%, 0) rotate(-38deg);
        opacity: 0;
      }
    }

    /* Memory Resonance Optical Ripple:
       Feathered champagne-gold & warm ivory glass refraction (Gaussian softened, no sharp concentric rings, ~680ms)
    */
    .memory-resonance-ripple {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 4;
      transform: translate(-50%, -50%) scale(0.12);
      box-shadow: 
        0 0 35px 12px rgba(235, 206, 150, 0.16),
        inset 0 0 25px 8px rgba(250, 235, 200, 0.12);
      background: radial-gradient(
        circle,
        rgba(255, 248, 232, 0.14) 0%,
        rgba(232, 202, 142, 0.09) 38%,
        rgba(195, 155, 90, 0.03) 65%,
        transparent 80%
      );
      filter: blur(12px);
      mix-blend-mode: screen;
      animation: memory-resonance-expand 680ms 200ms cubic-bezier(0.2, 0.8, 0.35, 1) forwards;
      will-change: transform, opacity;
    }

    @keyframes memory-resonance-expand {
      0% {
        transform: translate(-50%, -50%) scale(0.12);
        opacity: 0;
      }
      25% {
        opacity: 0.24;
      }
      65% {
        opacity: 0.14;
      }
      100% {
        transform: translate(-50%, -50%) scale(2.2);
        opacity: 0;
      }
    }

    /* Touch devices without fine pointer */
    @media (hover: none) {
      .card-interactive-sheen,
      .photo-inner-rim-sheen,
      .archival-glass-sheen,
      .memory-resonance-ripple,
      .photo-frame-target::before {
        display: none !important;
      }
      .card-magnetic-glide {
        transform: none !important;
        transition: none !important;
      }
    }

    /* Accessibility: prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .central-glow,
      .paper-living-light {
        animation: none !important;
        opacity: 0.35 !important;
      }
      .card-interactive-sheen {
        display: none !important;
      }
      .perimeter-trace-beam {
        animation: none !important;
        stroke-dashoffset: 0 !important;
        stroke-dasharray: none !important;
        opacity: 0.35 !important;
      }
      .corner-glint-tl,
      .corner-glint-tr,
      .corner-glint-br,
      .corner-glint-bl {
        animation: none !important;
        opacity: 0 !important;
      }
      .photo-frame-target.is-active .steady-settled-aura,
      .photo-frame-target:focus-visible .steady-settled-aura {
        opacity: 0.35 !important;
      }
      .archival-glass-sheen,
      .memory-resonance-ripple {
        display: none !important;
      }
      .photo-frame-target.is-active::before {
        opacity: 0.35 !important;
      }
      .card-magnetic-glide {
        transform: none !important;
        transition: none !important;
      }
    }
  </style>
<!-- END: Custom Styles -->
</head>

<script>
  (function initParticleEngine() {
    const canvas = document.getElementById('dustParticlesCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    let width = 0;
    let height = 0;
    let animationFrame = null;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const particles = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      if (particles.length === 0) {
        initParticles();
      }
    }

    function initParticles() {
      particles.length = 0;

      // Layer 1: Distant dust (~32 specks)
      const distantCount = Math.floor(Math.min(width, 1600) * 0.024);
      for (let i = 0; i < distantCount; i++) {
        particles.push({
          layer: 1,
          x: Math.random() * width,
          y: Math.random() * height,
          radius: 0.6 + Math.random() * 0.7,
          vx: (Math.random() - 0.48) * 0.12,
          vy: -0.08 - Math.random() * 0.14,
          baseOpacity: 0.14 + Math.random() * 0.22,
          opacity: 0.2,
          twinkleSpeed: 0.008 + Math.random() * 0.015,
          twinklePhase: Math.random() * Math.PI * 2,
          color: '235, 209, 149'
        });
      }

      // Layer 2: Midground particles (~24 specks)
      const midCount = Math.floor(Math.min(width, 1600) * 0.018);
      for (let i = 0; i < midCount; i++) {
        particles.push({
          layer: 2,
          x: Math.random() * width,
          y: Math.random() * height,
          radius: 1.1 + Math.random() * 0.9,
          vx: (Math.random() - 0.5) * 0.16,
          vy: -0.14 - Math.random() * 0.22,
          baseOpacity: 0.35 + Math.random() * 0.38,
          opacity: 0.5,
          twinkleSpeed: 0.015 + Math.random() * 0.028,
          twinklePhase: Math.random() * Math.PI * 2,
          color: '245, 220, 163',
          glow: true
        });
      }

      // Layer 3: Out-of-focus Bokeh discs (8 - 12 circles)
      const bokehCount = 9;
      for (let i = 0; i < bokehCount; i++) {
        particles.push({
          layer: 3,
          x: Math.random() * width,
          y: Math.random() * height,
          radius: 8 + Math.random() * 12,
          vx: (Math.random() - 0.5) * 0.08,
          vy: -0.04 - Math.random() * 0.08,
          baseOpacity: 0.08 + Math.random() * 0.14,
          opacity: 0.1,
          twinkleSpeed: 0.005 + Math.random() * 0.01,
          twinklePhase: Math.random() * Math.PI * 2,
          color: '223, 186, 110',
          isBokeh: true
        });
      }
    }

    function renderStatic() {
      ctx.clearRect(0, 0, width, height);
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        ctx.beginPath();
        if (p.isBokeh) {
          const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
          grad.addColorStop(0, `rgba(${p.color}, ${p.baseOpacity})`);
          grad.addColorStop(0.5, `rgba(${p.color}, ${p.baseOpacity * 0.45})`);
          grad.addColorStop(1, `rgba(${p.color}, 0)`);
          ctx.fillStyle = grad;
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = `rgba(${p.color}, ${p.baseOpacity})`;
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    let timestamp = 0;
    function animate(time) {
      timestamp = time || 0;
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];

        // Motion physics
        p.x += p.vx;
        p.y += p.vy;

        // Smooth wrap-around recycling without abrupt popping
        if (p.y < -p.radius * 2) {
          p.y = height + p.radius;
          p.x = Math.random() * width;
        } else if (p.y > height + p.radius * 2) {
          p.y = -p.radius;
          p.x = Math.random() * width;
        }
        if (p.x < -p.radius * 2) {
          p.x = width + p.radius;
        } else if (p.x > width + p.radius * 2) {
          p.x = -p.radius;
        }

        // Fluctuation/Twinkle
        p.twinklePhase += p.twinkleSpeed;
        const pulse = Math.sin(p.twinklePhase);
        const dynamicOpacity = Math.max(0.04, p.baseOpacity + pulse * (p.layer === 2 ? 0.28 : 0.08));

        ctx.beginPath();
        if (p.isBokeh) {
          const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
          grad.addColorStop(0, `rgba(${p.color}, ${dynamicOpacity})`);
          grad.addColorStop(0.5, `rgba(${p.color}, ${dynamicOpacity * 0.45})`);
          grad.addColorStop(1, `rgba(${p.color}, 0)`);
          ctx.fillStyle = grad;
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        } else {
          if (p.glow && dynamicOpacity > 0.4) {
            ctx.shadowColor = 'rgba(223, 184, 103, 0.45)';
            ctx.shadowBlur = 3.5;
          } else {
            ctx.shadowBlur = 0;
          }
          ctx.fillStyle = `rgba(${p.color}, ${dynamicOpacity})`;
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.shadowBlur = 0;

      animationFrame = requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize, { passive: true });
    resize();

    if (prefersReducedMotion) {
      renderStatic();
    } else {
      animationFrame = requestAnimationFrame(animate);
    }
  })();
</script>

<script>
  (function initPointerLighting() {
    // Only execute on devices supporting hover
    if (window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      const card = document.getElementById('archivalPhotoCard');
      const photoFrame = document.getElementById('interactivePhotoFrame');
      const matte = document.getElementById('darkArchivalMatte');
      const rippleContainer = document.getElementById('rippleContainer');
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (!card) return;

      let currentX = 50;
      let currentY = 50;
      let targetX = 50;
      let targetY = 50;
      let isHovered = false;
      let animationFrameId = null;

      // Soft Magnetic Glide State (dx normalized -1 to +1 -> max ±2px X, -4px Y lift)
      let currentGlideX = 0;
      let currentGlideY = 0;
      let targetGlideX = 0;
      let targetGlideY = 0;

      function updateCoordinates() {
        // Smooth lerp easing for card background
        currentX += (targetX - currentX) * 0.12;
        currentY += (targetY - currentY) * 0.12;

        card.style.setProperty('--mouse-x', currentX.toFixed(2) + '%');
        card.style.setProperty('--mouse-y', currentY.toFixed(2) + '%');

        if (!prefersReducedMotion) {
          // Subtle magnetic response with slight inertia
          currentGlideX += (targetGlideX - currentGlideX) * 0.085;
          currentGlideY += (targetGlideY - currentGlideY) * 0.085;
          card.style.setProperty('--card-glide-x', currentGlideX.toFixed(2) + 'px');
          card.style.setProperty('--card-glide-y', currentGlideY.toFixed(2) + 'px');
        }

        const needsMoreLerp = Math.abs(targetX - currentX) > 0.08 ||
                              Math.abs(targetY - currentY) > 0.08 ||
                              Math.abs(targetGlideX - currentGlideX) > 0.02 ||
                              Math.abs(targetGlideY - currentGlideY) > 0.02;

        if (isHovered || needsMoreLerp) {
          animationFrameId = requestAnimationFrame(updateCoordinates);
        } else {
          if (!isHovered && !prefersReducedMotion) {
            currentGlideX = 0;
            currentGlideY = 0;
            card.style.setProperty('--card-glide-x', '0px');
            card.style.setProperty('--card-glide-y', '0px');
          }
          animationFrameId = null;
        }
      }

      function updateGlideTargets(clientX, clientY, rect) {
        if (prefersReducedMotion) return;
        // dx normalized from -1 (left) to +1 (right) relative to center of card
        const centerX = rect.left + rect.width / 2;
        const normalizedDx = Math.max(-1, Math.min(1, (clientX - centerX) / (rect.width / 2)));
        targetGlideX = normalizedDx * 2; // max ±2px
        targetGlideY = -4; // upward lift of 4px
      }

      card.addEventListener('pointerenter', (e) => {
        isHovered = true;
        card.classList.add('card-has-pointer');
        const rect = card.getBoundingClientRect();
        targetX = ((e.clientX - rect.left) / rect.width) * 100;
        targetY = ((e.clientY - rect.top) / rect.height) * 100;
        updateGlideTargets(e.clientX, e.clientY, rect);
        if (!animationFrameId) {
          animationFrameId = requestAnimationFrame(updateCoordinates);
        }
      });

      card.addEventListener('pointermove', (e) => {
        const rect = card.getBoundingClientRect();
        targetX = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
        targetY = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));
        updateGlideTargets(e.clientX, e.clientY, rect);
        if (!animationFrameId) {
          animationFrameId = requestAnimationFrame(updateCoordinates);
        }
      });

      card.addEventListener('pointerleave', () => {
        isHovered = false;
        card.classList.remove('card-has-pointer');
        targetX = 50;
        targetY = 50;
        targetGlideX = 0;
        targetGlideY = 0;
        if (!animationFrameId) {
          animationFrameId = requestAnimationFrame(updateCoordinates);
        }
      });

      // Unified & harmonized photo region handling
      if (photoFrame) {
        let leaveDebounceTimer = null;
        let isPhotoRegionHovered = false;
        let rippleTriggeredThisEntry = false;
        let frameTargetX = 50;
        let frameTargetY = 50;
        let currentFrameX = 50;
        let currentFrameY = 50;
        let frameLerpRaf = null;

        function updateFrameLerp() {
          currentFrameX += (frameTargetX - currentFrameX) * 0.15;
          currentFrameY += (frameTargetY - currentFrameY) * 0.15;

          photoFrame.style.setProperty('--frame-px', currentFrameX.toFixed(1) + '%');
          photoFrame.style.setProperty('--frame-py', currentFrameY.toFixed(1) + '%');
          photoFrame.style.setProperty('--photo-rx', currentFrameX.toFixed(1) + '%');
          photoFrame.style.setProperty('--photo-ry', currentFrameY.toFixed(1) + '%');

          if (isPhotoRegionHovered && (Math.abs(frameTargetX - currentFrameX) > 0.08 || Math.abs(frameTargetY - currentFrameY) > 0.08)) {
            frameLerpRaf = requestAnimationFrame(updateFrameLerp);
          } else {
            frameLerpRaf = null;
          }
        }

        function triggerOpticalRipple(clientX, clientY) {
          if (!rippleContainer || prefersReducedMotion || rippleTriggeredThisEntry) return;
          rippleTriggeredThisEntry = true;

          const matteRect = (matte || photoFrame).getBoundingClientRect();
          const rippleX = clientX - matteRect.left;
          const rippleY = clientY - matteRect.top;

          // Spawn single optical ripple tuned to 680ms
          const ripple = document.createElement('div');
          ripple.className = 'memory-resonance-ripple';
          const size = Math.max(matteRect.width, matteRect.height) * 1.1;
          ripple.style.width = size + 'px';
          ripple.style.height = size + 'px';
          ripple.style.left = rippleX + 'px';
          ripple.style.top = rippleY + 'px';

          rippleContainer.appendChild(ripple);

          // Clean up after completion
          setTimeout(() => {
            if (ripple.parentNode) {
              ripple.parentNode.removeChild(ripple);
            }
          }, 950);
        }

        function handlePointerEnter(e) {
          if (leaveDebounceTimer) {
            clearTimeout(leaveDebounceTimer);
            leaveDebounceTimer = null;
          }

          if (!isPhotoRegionHovered) {
            isPhotoRegionHovered = true;
            photoFrame.classList.add('is-active');
            photoFrame.style.setProperty('--frame-sheen-opacity', '1');

            // Trigger single gentle optical ripple at entry coordinates
            triggerOpticalRipple(e.clientX, e.clientY);
          }

          updatePointerCoords(e);
        }

        function handlePointerMove(e) {
          if (leaveDebounceTimer) {
            clearTimeout(leaveDebounceTimer);
            leaveDebounceTimer = null;
          }

          if (!isPhotoRegionHovered) {
            isPhotoRegionHovered = true;
            photoFrame.classList.add('is-active');
            photoFrame.style.setProperty('--frame-sheen-opacity', '1');
            triggerOpticalRipple(e.clientX, e.clientY);
          }

          updatePointerCoords(e);
        }

        function handlePointerLeave() {
          // Unified 280ms debounce across photoFrame and internal matte children
          if (leaveDebounceTimer) clearTimeout(leaveDebounceTimer);
          leaveDebounceTimer = setTimeout(() => {
            isPhotoRegionHovered = false;
            rippleTriggeredThisEntry = false;
            photoFrame.classList.remove('is-active');
            photoFrame.style.setProperty('--frame-sheen-opacity', '0');
          }, 280);
        }

        function updatePointerCoords(e) {
          const rect = photoFrame.getBoundingClientRect();
          const rx = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
          const ry = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));

          frameTargetX = rx;
          frameTargetY = ry;

          if (!frameLerpRaf) {
            frameLerpRaf = requestAnimationFrame(updateFrameLerp);
          }
        }

        photoFrame.addEventListener('pointerenter', handlePointerEnter);
        photoFrame.addEventListener('pointermove', handlePointerMove);
        photoFrame.addEventListener('pointerleave', handlePointerLeave);
      }
    }
  })();
</script>
<!-- END: PointerLightingScript -->


</body></html>
